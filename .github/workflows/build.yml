name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode Environment
      run: |
        sudo xcode-select -switch /Applications/Xcode.app
        xcodebuild -version

    - name: Install XcodeGen (Project Generator)
      run: |
        brew install xcodegen

    - name: Prepare Project Structure
      run: |
        # Kaynak kodlar için dizin oluştur
        mkdir -p Sources

        # Swift dosyalarını taşı
        mv GameRuntimeManager.swift Sources/
        mv ContentView.swift Sources/

        # Uygulama ana giriş dosyasını oluştur
        cat << 'EOF' > Sources/AppMain.swift
        import SwiftUI

        @main
        struct PCGameEmulatorApp: App {
            var body: some Scene {
                WindowGroup {
                    ContentView()
                }
            }
        }
        EOF

        # Xcode projesini otomatik üretecek olan project.yml dosyasını oluştur
        cat << 'EOF' > project.yml
        name: PCGameEmulator
        options:
          bundleIdPrefix: com.emulatore.pcgame
        targets:
          PCGameEmulator:
            type: application
            platform: iOS
            deploymentTarget: "16.0"
            sources: [Sources]
            settings:
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGNING_ALLOWED: "NO"
              INFOPLIST_FILE: Sources/Info.plist
        EOF

        # Basit bir Info.plist oluşturalım
        cat << 'EOF' > Sources/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.emulatore.pcgame.PCGameEmulator</string>
            <key>CFBundleName</key>
            <string>PCGameEmulator</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>UILaunchScreen</key>
            <dict/>
        </dict>
        </plist>
        EOF

    - name: Generate Xcode Project & Build
      run: |
        # Xcodegen ile .xcodeproj dosyasını üret
        xcodegen generate

        # Projeyi iOS Simulator hedefi için derle (Test build)
        xcodebuild -project PCGameEmulator.xcodeproj \
                   -scheme PCGameEmulator \
                   -sdk iphonesimulator \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build
        
        echo "Derleme başarıyla tamamlandı!"
