name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Check Environment
      run: |
        echo "GitHub Actions Mac sunucusu başarıyla ayağa kalktı."
        # Sistemde yüklü olan aktif Xcode sürümünü seçelim
        sudo xcode-select -switch /Applications/Xcode.app
        xcodebuild -version
        swift --version
