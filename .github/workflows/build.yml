name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode Environment
      run: |
        sudo xcode-select -switch /Applications/Xcode.app
        xcodebuild -version

    - name: Install XcodeGen (Project Generator)
      run: |
        brew install xcodegen

    - name: Prepare Project Structure
      run: |
        mkdir -p Sources

        mv GameRuntimeManager.swift Sources/
        mv ContentView.swift Sources/

        cat << 'EOF' > Sources/AppMain.swift
        import SwiftUI

        @main
        struct PCGameEmulatorApp: App {
            var body: some Scene {
                WindowGroup {
                    ContentView()
                }
            }
        }
        EOF

        cat << 'EOF' > project.yml
        name: PCGameEmulator
        options:
          bundleIdPrefix: com.emulatore.pcgame
        targets:
          PCGameEmulator:
            type: application
            platform: iOS
            deploymentTarget: "16.0"
            sources: [Sources]
            settings:
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGNING_ALLOWED: "NO"
              INFOPLIST_FILE: Sources/Info.plist
        EOF

        cat << 'EOF' > Sources/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.emulatore.pcgame.PCGameEmulator</string>
            <key>CFBundleName</key>
            <string>PCGameEmulator</string>
            <key>CFBundleDisplayName</key>
            <string>PC Game Emulator</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
                <string>UIInterfaceOrientationLandscapeLeft</string>
                <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
        </dict>
        </plist>
        EOF

    - name: Build and Package IPA
      run: |
        xcodegen generate

        # Doğrudan derleme ve çıktı konumu yakalama
        xcodebuild -project PCGameEmulator.xcodeproj \
                   -scheme PCGameEmulator \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build

        # Derlenen .app dosyasını bul ve Payload içine kopyala
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PCGameEmulator.app" -type d | head -n 1)
        
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find build -name "PCGameEmulator.app" -type d | head -n 1)
        fi

        echo "Bulunan App Yolu: $APP_PATH"
        
        mkdir -p build/Payload
        cp -R "$APP_PATH" build/Payload/
        
        cd build
        zip -r PCGameEmulator.ipa Payload
        cd ..

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCGameEmulator-IPA
        path: build/PCGameEmulator.ipa
